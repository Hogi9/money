name: CD

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code..."
            git pull origin ${{ github.ref_name }}

            echo "==> Rebuilding Docker container..."
            docker compose down
            docker compose up -d --build

            echo "==> Waiting for container to be ready..."
            sleep 10

            echo "==> Building frontend assets..."
            docker compose exec -T laravel-money npm ci
            docker compose exec -T laravel-money npm run build

            echo "==> Running post-deploy commands..."
            docker compose exec -T laravel-money php artisan config:cache
            docker compose exec -T laravel-money php artisan route:cache
            docker compose exec -T laravel-money php artisan view:cache

            echo "==> Deploy complete!"
